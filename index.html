<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes — System Design</title>
    <link rel="stylesheet" href="style.css" />
    <script src="api.js" defer></script>
  </head>
  <body>
    <header>
      <h1>QuickNotes</h1>
      <p>Capture ideas before they disappear.</p>
    </header>

    <main>
      <section class="note-form-section">
        <h2>Create a note</h2>

        <form id="note-form">
          <label for="title-input">Title</label>
          <input
            type="text"
            id="title-input"
            maxlength="100"
            required
            placeholder="Enter your note title"
          />

          <label for="body-input">Body</label>
          <textarea
            id="body-input"
            rows="4"
            placeholder="Write your note here..."
          ></textarea>

          <button type="submit" id="submit-btn">Add note</button>
        </form>
      </section>

      <section class="notes-section">
        <div class="section-heading">
          <h2>Your notes</h2>
          <button type="button" id="load-btn">Load notes</button>
        </div>

        <p id="status" role="status" aria-live="polite">
          Click "Load notes" to get started.
        </p>

        <ul id="notes-list"></ul>
      </section>
    </main>
  </body>
</html>
